<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="FLEXfg | PhishAware"
     viewBox="0 0 900 220">

  <!-- Transparante achtergrond -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Gradient voor FLEX (diagonaal ↘︎) -->
  <defs>
    <linearGradient id="flexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- Pas deze stops aan als je exacte huisstijl-HEX’en hebt -->
      <stop offset="0%"   stop-color="#2AA9E0"/>  <!-- blauw licht -->
      <stop offset="35%"  stop-color="#219BD4"/>  <!-- blauw iets donkerder -->
      <stop offset="65%"  stop-color="#6E49B8"/>  <!-- overgangs-paars -->
      <stop offset="100%" stop-color="#7D3FBF"/>  <!-- paars -->
    </linearGradient>
  </defs>

  <!-- Stijlen (ongewijzigd) -->
  <style>
    .brand { font-family: "Segoe UI", "SegoeUI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 96px; letter-spacing: 0.6px; }
    .pipe  { font-family: "Segoe UI", "SegoeUI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 60px; fill: #000; }
    .text  { font-family: "Segoe UI", "SegoeUI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 60px; fill: #000; }
    .pipe, .text { dominant-baseline: alphabetic; }
  </style>

  <!-- FLEX met gradient + fg paars (zonder witruimte) + gelijke witruimte rond | -->
  <text class="brand" x="30" y="125">
    <!-- FLEX in gradient -->
    <tspan fill="url(#flexGradient)">FLEX</tspan><tspan fill="#7D3FBF" dx="-6">fg</tspan>
    <!-- gelijke witruimte aan beide kanten van de pipe -->
    <tspan class="pipe" dx="24">|</tspan>
    <tspan class="text" dx="24">PhishAware</tspan>
  </text>
</svg>
